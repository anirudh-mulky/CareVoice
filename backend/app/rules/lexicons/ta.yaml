negation_before: []
# "vali illa" = no pain.
negation_after: [illa, illai, இல்லை, இல்ல, illae]
# "valikkala" = does not hurt.
negation_suffixes: [kala, கல, illa, இல்ல, illai, இல்லை]
# "vali koraiyala" = pain not reducing: still escalate.
negation_blockers: [korai, குறை, koraiyala, kuraiyala, nikkala, நிக்கல]
clause_breakers: [aana, ஆனா, aanaal, ஆனால், matrum, மற்றும்]

intensifiers: [romba, ரொம்ப, adhigam, அதிகம், nalla]
mild: [konjam, கொஞ்சம், lesaa, லேசா, lesaana, லேசான]
onset_words: [nethu, நேத்து, inniki, இன்னிக்கு, kaalaiyila, காலையில, raathiri, ராத்திரி]
duration_units: [naal, நாள், naala, naalaa, mani, மணி]

"yes": [aamaa, ஆமா, aam, ஆம், sari, சரி]
"no": [illa, இல்லை, illai, thappu, தப்பு, alla, அல்ல]

read_back: "நீங்கள் சொன்னது: {items}. இது சரியா?"
read_back_general: "நீங்கள் சொன்னதை உங்கள் மருத்துவருக்கு அனுப்புகிறேன். சரியா?"
joiner: மற்றும்
very: ரொம்ப
