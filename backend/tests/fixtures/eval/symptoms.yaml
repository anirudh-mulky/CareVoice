# AI eval set for analyse_symptom + decision rules (spec: "Testing and QA").
# Each case: the patient's words, their template, and the expected red flags, minor
# symptoms and outcome. The gate: no red flag in this set is ever missed.
# template: cataract | c-section (from app/seed/templates.json)

kn:
