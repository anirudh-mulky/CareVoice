# Messages outcomes sends to the patient, per language. Needs a native-speaker check.
en:
  safety: "What you described may be an important warning sign. Please come to the hospital today. If it is an emergency, go to the nearest hospital now."
  remedy_intro: "Message from your doctor:"
  reply_intro: "Your doctor says:"
kn:
  safety: "ನೀವು ಹೇಳಿದ್ದು ಮುಖ್ಯವಾದ ಎಚ್ಚರಿಕೆಯ ಲಕ್ಷಣ ಆಗಿರಬಹುದು. ದಯವಿಟ್ಟು ಇಂದೇ ಆಸ್ಪತ್ರೆಗೆ ಬನ್ನಿ. ತುರ್ತು ಆಗಿದ್ದರೆ ಈಗಲೇ ಹತ್ತಿರದ ಆಸ್ಪತ್ರೆಗೆ ಹೋಗಿ."
  remedy_intro: "ನಿಮ್ಮ ವೈದ್ಯರಿಂದ ಸಂದೇಶ:"
  reply_intro: "ನಿಮ್ಮ ವೈದ್ಯರು ಹೇಳುತ್ತಾರೆ:"
hi:
  safety: "आपने जो बताया वह एक ज़रूरी ख़तरे का लक्षण हो सकता है। कृपया आज ही अस्पताल आएँ। आपात स्थिति हो तो अभी नज़दीकी अस्पताल जाएँ।"
  remedy_intro: "आपके डॉक्टर का संदेश:"
  reply_intro: "आपके डॉक्टर कहते हैं:"
ta:
  safety: "நீங்கள் சொன்னது முக்கியமான எச்சரிக்கை அறிகுறியாக இருக்கலாம். தயவுசெய்து இன்றே மருத்துவமனைக்கு வாருங்கள். அவசரம் என்றால் இப்போதே அருகிலுள்ள மருத்துவமனைக்குச் செல்லுங்கள்."
  remedy_intro: "உங்கள் மருத்துவரின் செய்தி:"
  reply_intro: "உங்கள் மருத்துவர் சொல்கிறார்:"
