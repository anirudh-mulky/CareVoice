[project]
name = "carevoice-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency style: Depends()/Query()/Header() in defaults is intended.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
