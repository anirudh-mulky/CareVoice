name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests conftest.py
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with no .env
        run: docker compose up --build -d
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/v1/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Main screen is our app, not a default page
        run: curl -fsS http://localhost:3000/ | grep -q "<title>CareVoice</title>"
      - name: Demo data is seeded and resettable
        run: curl -fsS -X POST http://localhost:3000/api/v1/demo/reset | grep -q '"patients":3'
      - if: always()
        run: docker compose down -v
