  - {id: kn-02, template: cataract, text: "ಕಣ್ಣು ತುಂಬಾ ಕೆಂಪಾಗಿದೆ, ನೋವು ಇದೆ", flags: [rf_redness, rf_eye_pain], type: alert}
  - {id: kn-03, template: cataract, text: "novu illa, swalpa turike ide", minors: [ms_itching], type: minor, note: negation}
  - {id: kn-04, template: cataract, text: "ನೋವು ಇಲ್ಲ, ಸ್ವಲ್ಪ ತುರಿಕೆ ಇದೆ", minors: [ms_itching], type: minor, note: negation}
  - {id: kn-05, template: cataract, text: "kannu mabbu aagide, sariyagi kaanisuttilla", flags: [rf_vision_loss], type: alert}
  - {id: kn-06, template: cataract, text: "kannininda keevu baruttide", flags: [rf_discharge], type: alert}
  - {id: kn-07, template: cataract, text: "eye red aagide, pain ide", flags: [rf_redness, rf_eye_pain], type: alert, note: code-mixed}
  - {id: kn-08, template: cataract, text: "kannalli neeru baruttide, bere enu illa", minors: [ms_watering], type: minor}
  - {id: kn-09, template: cataract, text: "belaku chuchutte, kannu sari ide", minors: [ms_glare], type: minor}
  - {id: kn-10, template: cataract, text: "vaanti aaytu, kannu novu", flags: [rf_vomiting, rf_eye_pain], type: alert}
  - {id: kn-11, template: cataract, text: "kempu illa, novu illa", type: general, note: negation}
  - {id: kn-12, template: cataract, text: "ಬೆಳಕಿನ ಮಿಂಚು ಕಾಣಿಸುತ್ತಿದೆ", flags: [rf_flashes], type: alert}
  - {id: kn-13, template: cataract, text: "novu kadime aagilla", flags: [rf_eye_pain], type: alert, note: "'not reducing' is not a negation"}

